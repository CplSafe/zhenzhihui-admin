# zhenzhihui-admin 运营后台 nginx 配置(独立端口 8002)
#
# 与 C 端前端隔离:admin 单独占 8002,/api 与 /auth 反代到本机 9000 业务后端。
# 同源(同 IP)→ OAuth 回调与 HttpOnly Cookie 自动打通。
#
# 部署后访问:http://115.190.63.215:8002/
#
# 注意(登录回跳):
#   后端 OAuth 登录成功后会 302 到服务器 auth_applications.frontend_success_url,
#   该值若指向 C 端(8001),则从 8002 发起登录、登完会跳到 8001。
#   但 token Cookie 种在 115.190.63.215 域(不区分端口),所以登录后手动回到
#   http://115.190.63.215:8002/ 即可,/admin/session 会认出已登录会话。
#   如需登完直接回 8002,请运维在 auth_applications.frontend_success_url 增加
#   http://115.190.63.215:8002/ 白名单(或改为该地址)。

server {
    listen 8002;
    server_name 115.190.63.215;

    # admin 前端静态资源(把本机构建好的 dist/ 放到这个目录)
    root /var/www/zhenzhihui-admin;
    index index.html;

    # gzip(JS 包较大,开启压缩)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 业务接口 → 9000 后端。保留 Host 与 Cookie,OAuth 会话才能正确建立。
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 登录/回调 → 9000 后端(/auth/login、/auth/callback)
    location /auth/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源带强缓存(文件名带 hash,可长缓存)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback:其余路径都回 index.html,交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
